<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>坐席业绩排行榜 · 大屏</title>
<style>
  :root{
    --bg1:#050a1c; --bg2:#0a1330; --bg3:#0d1a3f;
    --panel:rgba(255,255,255,.045);
    --panel-brd:rgba(120,165,255,.18);
    --text:#eaf1fb; --text2:#9fb2cf; --text3:#64779c;
    --heading:#ffffff; --hshadow:0 0 30px rgba(57,208,255,.25);
    --accent:#39d0ff; --accent2:#5b8cff;
    --gold:#ffd34e; --silver:#d6e6fb; --bronze:#ff9d4d;
    --good:#34d399; --good-bg:rgba(52,211,153,.14);
    --mid:#5b8cff;  --mid-bg:rgba(91,140,255,.16);
    --low:#fbbf24;  --low-bg:rgba(251,191,36,.15);
    --radius:18px;
    --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font);color:var(--text);line-height:1.5;
    -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
    background:
      radial-gradient(1200px 700px at 12% -10%, rgba(57,208,255,.16), transparent 55%),
      radial-gradient(1100px 700px at 92% 8%, rgba(91,140,255,.18), transparent 55%),
      linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg1) 100%);
    background-attachment:fixed;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background-image:linear-gradient(rgba(120,165,255,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(120,165,255,.05) 1px,transparent 1px);
    background-size:46px 46px;mask-image:radial-gradient(circle at 50% 40%,#000 30%,transparent 80%);
  }
  .wrap{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding:22px 30px 36px;min-height:100vh;display:flex;flex-direction:column;}

  /* ===== Header ===== */
  .brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:10px;text-align:center;}
  .brand-left{display:flex;align-items:center;gap:16px;}
  .logo{
    width:56px;height:56px;border-radius:16px;flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;color:#04122b;
    box-shadow:0 0 26px rgba(57,208,255,.55);
  }
  .brand h1{font-size:clamp(26px,3.2vw,38px);font-weight:900;letter-spacing:1px;
    color:var(--heading);text-shadow:var(--hshadow);line-height:1.1;}
  .brand .sub{font-size:13px;color:var(--text2);font-weight:600;margin-top:4px;letter-spacing:2px;}
  .clock{text-align:center;}
  .clock .time{font-size:clamp(24px,2.8vw,34px);font-weight:800;font-variant-numeric:tabular-nums;
    color:var(--accent);text-shadow:0 0 22px rgba(57,208,255,.45);letter-spacing:1px;}
  .clock .date{font-size:12.5px;color:var(--text2);margin-top:2px;letter-spacing:1px;}

  /* ===== Podium (compact Top3) ===== */
  .hero{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:2px 0 10px;}
  .pcard{
    position:relative;flex:1;max-width:300px;border-radius:14px;padding:9px 14px 11px;
    background:var(--panel);border:1px solid var(--panel-brd);overflow:hidden;
    display:flex;flex-direction:column;align-items:center;text-align:center;backdrop-filter:blur(6px);
  }
  .pcard::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;}
  .pcard.p1{max-width:330px;padding-top:13px;box-shadow:0 0 30px rgba(255,211,78,.25);border-color:rgba(255,211,78,.45);}
  .pcard.p1::after{background:linear-gradient(90deg,#ffe08a,var(--gold),#ffe08a);}
  .pcard.p2{box-shadow:0 0 24px rgba(214,230,251,.18);border-color:rgba(214,230,251,.4);}
  .pcard.p2::after{background:linear-gradient(90deg,#eef5ff,var(--silver));}
  .pcard.p3{box-shadow:0 0 24px rgba(255,157,77,.2);border-color:rgba(255,157,77,.4);}
  .pcard.p3::after{background:linear-gradient(90deg,#ffd0a3,var(--bronze));}
  .pcard .crown{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:24px;filter:drop-shadow(0 0 14px rgba(255,211,78,.8));}
  .pcard .medal{position:absolute;top:8px;right:10px;font-size:20px;filter:drop-shadow(0 0 8px rgba(0,0,0,.5));}
  .pcard .avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:800;color:#04122b;margin-bottom:5px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 18px rgba(57,208,255,.45);}
  .pcard.p1 .avatar{width:58px;height:58px;font-size:23px;background:linear-gradient(135deg,#ffe08a,var(--gold));box-shadow:0 0 26px rgba(255,211,78,.6);}
  .pcard.p2 .avatar{background:linear-gradient(135deg,#eef5ff,var(--silver));box-shadow:0 0 16px rgba(214,230,251,.45);}
  .pcard.p3 .avatar{background:linear-gradient(135deg,#ffd0a3,var(--bronze));box-shadow:0 0 16px rgba(255,157,77,.45);}
  .pcard .pname{font-size:16px;font-weight:800;letter-spacing:1px;}
  .pcard.p1 .pname{font-size:19px;}
  .pcard .pqueue{font-size:11.5px;font-weight:700;color:var(--text2);letter-spacing:1px;margin-top:2px;}
  .pcard .pscore{margin-top:5px;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;
    color:#fff;}
  .pcard.p1 .pscore{font-size:34px;color:var(--gold);text-shadow:0 0 22px rgba(255,211,78,.5);}
  .pcard .pscore small{font-size:12px;font-weight:700;color:var(--text3);margin-left:3px;}

  /* ===== Controls ===== */
  .controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .seg-group{display:inline-flex;background:rgba(255,255,255,.05);border:1px solid var(--panel-brd);border-radius:14px;padding:5px;gap:4px;}
  .seg{border:none;background:transparent;color:var(--text2);font-weight:700;font-size:15px;
    padding:9px 24px;border-radius:10px;cursor:pointer;transition:all .2s var(--ease);
    display:inline-flex;align-items:center;gap:9px;user-select:none;font-family:var(--font);letter-spacing:1px;}
  .seg:hover{color:var(--text);}
  .seg.active{background:linear-gradient(135deg,rgba(57,208,255,.22),rgba(91,140,255,.22));color:#fff;box-shadow:0 0 18px rgba(57,208,255,.3);}
  .seg .live{width:8px;height:8px;border-radius:50%;background:var(--good);opacity:0;transition:opacity .25s;box-shadow:0 0 8px var(--good);}
  .seg.active .live{opacity:1;animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.6);opacity:.5;}}
  .right-cluster{display:flex;align-items:center;gap:14px;}
  .countdown{display:inline-flex;align-items:center;gap:10px;font-size:13.5px;color:var(--text2);font-weight:700;
    background:rgba(255,255,255,.05);border:1px solid var(--panel-brd);border-radius:999px;padding:9px 16px;white-space:nowrap;letter-spacing:1px;}
  .countdown .dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 10px var(--good);}
  .countdown.paused{color:var(--bronze);border-color:rgba(255,157,77,.5);}
  .countdown.paused .dot{background:var(--bronze);box-shadow:0 0 10px var(--bronze);}
  .search{position:relative;}
  .search input{border:1px solid var(--panel-brd);background:rgba(255,255,255,.05);border-radius:999px;
    padding:10px 16px 10px 38px;font-size:14px;width:210px;outline:none;transition:all .2s var(--ease);
    font-family:var(--font);color:var(--text);}
  .search input::placeholder{color:var(--text3);}
  .search input:focus{border-color:var(--accent);background:rgba(57,208,255,.08);box-shadow:0 0 0 4px rgba(57,208,255,.15);width:230px;}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text3);}

  /* ===== Table ===== */
  .table-card{flex:1;min-height:0;background:var(--panel);border:1px solid var(--panel-brd);border-radius:var(--radius);
    box-shadow:0 0 40px rgba(0,0,0,.35);overflow:hidden;position:relative;display:flex;flex-direction:column;}
  .table-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent2),var(--good));box-shadow:0 0 16px rgba(57,208,255,.6);z-index:6;}
  .table-scroll{flex:1;overflow:auto;margin-top:3px;}
  table{width:100%;border-collapse:collapse;font-size:16px;}
  thead th{position:sticky;top:0;z-index:5;background:rgba(10,19,48,.96);backdrop-filter:blur(4px);
    color:var(--text2);font-weight:700;text-align:center;padding:11px 14px;white-space:nowrap;font-size:13px;
    letter-spacing:1.5px;border-bottom:1px solid var(--panel-brd);cursor:pointer;user-select:none;}
  thead th.no-sort{cursor:default;}
  thead th .arrow{font-size:11px;color:var(--text3);margin-left:6px;}
  thead th.sorted{color:var(--accent);}
  thead th.sorted .arrow{color:var(--accent);}
  tbody td{padding:9px 14px;border-bottom:1px solid rgba(120,165,255,.07);white-space:nowrap;text-align:center;}
  tbody td.num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text);}
  tbody tr{transition:background .15s var(--ease);}
  tbody tr:hover{background:rgba(57,208,255,.07);}
  tbody tr.top td{background:linear-gradient(90deg,rgba(255,211,78,.10),transparent 55%);}
  tbody tr.top:hover td{background:linear-gradient(90deg,rgba(255,211,78,.16),transparent 55%);}

  .rank{width:28px;height:28px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;
    font-weight:900;font-size:15px;background:rgba(255,255,255,.07);color:var(--text3);}
  .rank.g1{background:linear-gradient(135deg,#ffe08a,var(--gold));color:#5a3d00;box-shadow:0 0 16px rgba(255,211,78,.5);}
  .rank.g2{background:linear-gradient(135deg,#eef5ff,var(--silver));color:#3a4a63;box-shadow:0 0 14px rgba(214,230,251,.45);}
  .rank.g3{background:linear-gradient(135deg,#ffd0a3,var(--bronze));color:#5a2e00;box-shadow:0 0 14px rgba(255,157,77,.45);}

  .name-cell{font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;text-align:center;}
  .avatar-sm{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04122b;font-weight:800;font-size:13px;
    box-shadow:0 0 12px rgba(57,208,255,.4);}
  .nm{text-align:center;}
  .nm .id{font-size:12px;color:var(--text3);font-weight:600;margin-top:1px;letter-spacing:.5px;}

  .queue-pill{display:inline-block;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:700;
    background:rgba(255,255,255,.07);color:var(--text2);letter-spacing:1px;}
  .lvl{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:13.5px;padding:5px 13px;border-radius:999px;letter-spacing:.5px;}
  .lvl .dot{width:7px;height:7px;border-radius:50%;}
  .lvl.good{background:var(--good-bg);color:var(--good);} .lvl.good .dot{background:var(--good);box-shadow:0 0 8px var(--good);}
  .lvl.mid{background:var(--mid-bg);color:var(--mid);}   .lvl.mid .dot{background:var(--mid);box-shadow:0 0 8px var(--mid);}
  .lvl.low{background:var(--low-bg);color:var(--low);}   .lvl.low .dot{background:var(--low);box-shadow:0 0 8px var(--low);}

  .score{display:flex;align-items:center;justify-content:center;gap:12px;}
  .score .bar{position:relative;height:7px;width:92px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;flex:none;}
  .score .bar span{position:absolute;left:0;top:0;bottom:0;border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 12px rgba(57,208,255,.6);}
  .score b{font-variant-numeric:tabular-nums;font-weight:900;font-size:15px;color:#fff;min-width:30px;}

  .empty{padding:70px;text-align:center;color:var(--text3);font-size:16px;}
  footer{margin-top:14px;text-align:center;color:var(--text3);font-size:12px;letter-spacing:1px;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  .anim{animation:fadeUp .4s var(--ease) both;}

  /* ===== Theme decorative overlays ===== */
  body.theme-crt::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0px,rgba(0,0,0,.18) 1px,transparent 2px,transparent 3px);opacity:.5;}
  body.theme-hud::before{opacity:.85;
    background-image:linear-gradient(rgba(57,255,120,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(57,255,120,.10) 1px,transparent 1px);background-size:34px 34px;}

  /* ===== Design Picker ===== */
  .picker{position:fixed;right:16px;bottom:16px;z-index:50;width:300px;max-height:80vh;overflow:auto;
    background:rgba(12,16,28,.92);border:1px solid rgba(120,165,255,.3);border-radius:14px;padding:12px;
    box-shadow:0 16px 50px rgba(0,0,0,.6);backdrop-filter:blur(10px);}
  .picker h4{font-size:12px;color:#bcd2ff;margin-bottom:8px;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;}
  .picker h4 span{font-weight:400;color:#7e8db0;font-size:11px;}
  .picker .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}
  .swatch{border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:7px 8px;cursor:pointer;
    display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);transition:all .15s;color:#eaf1fb;}
  .swatch:hover{border-color:rgba(120,165,255,.6);transform:translateY(-1px);}
  .swatch.active{border-color:#39d0ff;box-shadow:0 0 12px rgba(57,208,255,.4);}
  .swatch .chip{width:22px;height:22px;border-radius:6px;flex:none;}
  .swatch .nm{font-size:12px;font-weight:700;line-height:1.1;}
  .swatch .idx{font-size:10px;color:#7e8db0;}
  .picker .hint{font-size:10.5px;color:#7e8db0;margin-top:9px;line-height:1.5;}

  @media(max-width:860px){
    .brand{flex-direction:column;align-items:flex-start;}
    .clock{text-align:center;}
    .controls{flex-direction:column;align-items:stretch;}
    .seg-group{width:100%;justify-content:space-between;}
    .seg{flex:1;justify-content:center;}
    .right-cluster{width:100%;justify-content:space-between;}
    .search input,.search input:focus{width:100%;}
    .picker{width:240px;}
  }
  @media(prefers-reduced-motion:reduce){.anim{animation:none;}.seg .live{animation:none;}}
</style>
</head>
<body class="theme-aurora">
<div class="wrap">

  <header class="brand">
    <div class="brand-left">
      <div class="logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/></svg>
      </div>
      <div>
        <h1>坐席业绩排行榜</h1>
        <div class="sub">服务运营部 · 个人坐席综合效能大屏</div>
      </div>
    </div>
    <div class="clock">
      <div class="time" id="clockTime">--:--:--</div>
      <div class="date" id="clockDate">--</div>
    </div>
  </header>

  <!-- Top 3 Podium -->
  <section class="hero" id="hero"></section>

  <div class="controls">
    <div class="seg-group" id="qfilter"></div>
    <div class="right-cluster">
      <div class="countdown" id="countdown"><span class="dot"></span><span id="cdTxt">自动轮播中</span></div>
      <div class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="searchInput" type="text" placeholder="搜索姓名 / 工号" />
      </div>
    </div>
  </div>

  <div class="table-card">
    <div class="table-scroll" id="scroll">
      <table>
        <thead>
          <tr>
            <th class="no-sort" style="width:56px">#</th>
            <th class="no-sort">坐席</th>
            <th class="no-sort">列队</th>
            <th data-field="rate">人均时产(h)<span class="arrow">↕</span></th>
            <th data-field="answer">接通量<span class="arrow">↕</span></th>
            <th data-field="callback">漏接回拨<span class="arrow">↕</span></th>
            <th data-field="avglen">处理均长(s)<span class="arrow">↕</span></th>
            <th class="no-sort">效能等级</th>
            <th data-field="score">综合得分<span class="arrow">↕</span></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <footer>服务运营部 · 坐席业绩排行榜（大屏原型）· 示例数据，可替换为接续数据_清洗匹配.xlsx 导出结果</footer>
</div>

<!-- Design Picker -->
<div class="picker" id="picker">
  <h4>设计切换器 <span id="curName"></span></h4>
  <div class="grid" id="swatchGrid"></div>
  <div class="hint">点击任一套即可预览 · 按 H 键隐藏/显示本面板 · 选中后告诉我，我定稿</div>
</div>

<script>
/* ===== Theme definitions (20) ===== */
const THEMES = [
  {id:"aurora",    name:"极光",     g:"linear-gradient(135deg,#39e0c8,#4f9bff)"},
  {id:"neon",      name:"霓虹都市", g:"linear-gradient(135deg,#ff3df0,#39d0ff)"},
  {id:"gold",      name:"香槟金",   g:"linear-gradient(135deg,#ffe08a,#d4af37)"},
  {id:"glass",     name:"毛玻璃",   g:"linear-gradient(135deg,#7fb8ff,#b6e3ff)"},
  {id:"cyber",     name:"赛博朋克", g:"linear-gradient(135deg,#ff2d95,#00e5ff)"},
  {id:"forest",    name:"森林",     g:"linear-gradient(135deg,#34d399,#0e8a5f)"},
  {id:"sunset",    name:"落日",     g:"linear-gradient(135deg,#ff8a3d,#ff4d8d)"},
  {id:"hud",       name:"军事HUD",  g:"linear-gradient(135deg,#39ff78,#1f9e4a)"},
  {id:"purple",    name:"紫梦",     g:"linear-gradient(135deg,#b06bff,#6b8bff)"},
  {id:"crt",       name:"复古CRT",  g:"linear-gradient(135deg,#39ff78,#1f9e4a)"},
  {id:"corporate", name:"商务蓝",   g:"linear-gradient(135deg,#2563eb,#60a5fa)"},
  {id:"candy",     name:"糖果粉",   g:"linear-gradient(135deg,#ff9ecb,#ffd6ec)"},
  {id:"blackgold", name:"黑金",     g:"linear-gradient(135deg,#ffd34e,#8a6a16)"},
  {id:"ocean",     name:"海洋",     g:"linear-gradient(135deg,#00c2ff,#0066cc)"},
  {id:"red",       name:"赤焰",     g:"linear-gradient(135deg,#ff4444,#ff9d4d)"},
  {id:"teal",      name:"青瓷",     g:"linear-gradient(135deg,#2dd4bf,#0d9488)"},
  {id:"pixel",     name:"像素",     g:"linear-gradient(135deg,#39d0ff,#5b8cff)"},
  {id:"lines",     name:"线性科技", g:"linear-gradient(135deg,#39d0ff,#5b8cff)"},
  {id:"wood",      name:"暖木",     g:"linear-gradient(135deg,#c79a6b,#8a5a2b)"},
  {id:"mono",      name:"极简白",   g:"linear-gradient(135deg,#334155,#94a3b8)"},
];

/* ===== Data layer ===== */
const QUEUES = ["综合", "人社", "公教企"];
const TH = {
  "综合":  { high: 15, mid: 10 },
  "公教企":{ high: 17, mid: 12 },
  "人社":  { high: 17, mid: 12 },
};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(20260901);
const SURNAMES = "王李张刘陈杨黄赵周吴徐孙朱马胡郭林何高梁郑罗宋谢唐韩冯于董萧程曹袁邓许傅沈曾彭吕苏卢蒋蔡贾丁魏薛叶阎余潘杜戴夏钟汪田任姜范方石姚谭廖邹熊金陆郝孔白崔康毛邱秦江史顾侯邵孟龙万段曹钱汤尹黎易常武乔贺赖龚文".split("");
const GIVEN = "伟芳娜秀英敏静丽强磊洋勇艳杰娟涛明超秀霞平刚桂英文辉力俊峰建华婷琳浩宇浩然晨曦子轩嘉怡思琪雨欣梓涵博文俊熙欣怡梦琪志强海燕晓东春梅国强丽华志明建军玉兰凤兰".split("");
function makeName(){ return SURNAMES[Math.floor(rnd()*SURNAMES.length)] + GIVEN[Math.floor(rnd()*GIVEN.length)]; }

function buildData(){
  const data = [];
  const plan = { "综合": 80, "公教企": 140, "人社": 40 };
  let seq = 1;
  for (const q of QUEUES){
    const t = TH[q];
    for (let i=0;i<plan[q];i++){
      const r = rnd();
      let rate;
      if (r < 0.30)      rate = t.high + rnd()*5;
      else if (r < 0.75) rate = t.mid + rnd()*(t.high-t.mid);
      else               rate = Math.max(4, t.mid - 4 + rnd()*4);
      rate = +rate.toFixed(1);
      const answer  = Math.round(rate*100 + rnd()*450 + 350);
      const avglen  = Math.min(240, Math.max(50, Math.round(150 + rnd()*80 - (rate - t.mid)*4)));
      const callback= Math.max(0, Math.round(rnd()*120 - (rate - t.mid)*4));
      const sRate = Math.min(1, rate / (t.high + 5));
      const sAns  = Math.min(1, answer / 3200);
      const sCb   = 1 - Math.min(1, callback / 150);
      const sLen  = 1 - Math.min(1, (avglen - 50) / 190);
      const score = Math.round((sRate*40 + sAns*30 + sCb*15 + sLen*15) * 10) / 10;
      data.push({ id: "A"+String(seq).padStart(4,"0"), name: makeName(), queue: q, rate, answer, callback, avglen, score });
      seq++;
    }
  }
  return data;
}
const ALL = buildData();

const state = { queueIndex: 0, search: "", field: "score", dir: "desc" };
const CYCLE_SEC = 30;
let cycleTimer = null, cycleStart = Date.now(), cyclePaused = false, searchActive = false, hoverPause = false;

function levelOf(d){ const t = TH[d.queue]; if (d.rate >= t.high) return "good"; if (d.rate >= t.mid) return "mid"; return "low"; }
const LVL_TXT = { good: "高效", mid: "中效", low: "低效" };
function currentQueue(){ return QUEUES[state.queueIndex]; }

function filtered(){
  const q = currentQueue();
  let arr = ALL.filter(d => d.queue === q);
  if (state.search){
    const k = state.search.trim().toLowerCase();
    arr = arr.filter(d => d.name.toLowerCase().includes(k) || d.id.toLowerCase().includes(k));
  }
  const f = state.field, dir = state.dir === "asc" ? 1 : -1;
  arr.sort((a,b) => (a[f] - b[f]) * dir);
  return arr;
}

const MEDAL = { 0:"🥇", 1:"🥈", 2:"🥉" };
function renderHero(arr){
  const top = [...arr].sort((a,b)=>b.score-a.score).slice(0,3);
  const order = [1,0,2];
  const hero = document.getElementById("hero");
  if (top.length < 3){ hero.innerHTML = ""; return; }
  hero.innerHTML = order.map(pos=>{
    const d = top[pos]; const lvl = levelOf(d);
    const cls = pos===0 ? "p1" : pos===1 ? "p2" : "p3";
    const crown = pos===0 ? `<div class="crown">👑</div>` : "";
    return `<div class="pcard ${cls} anim">
      ${crown}<div class="medal">${MEDAL[pos]}</div>
      <div class="avatar">${d.name[0]}</div>
      <div class="pname">${d.name}</div>
      <div class="pqueue">${d.id} · ${d.queue}</div>
      <div class="pscore">${d.score}<small>分</small></div>
    </div>`;
  }).join("");
}

function renderTable(arr){
  const tb = document.getElementById("tbody");
  if (!arr.length){ tb.innerHTML = `<tr><td colspan="9"><div class="empty">未找到匹配的坐席</div></td></tr>`; return; }
  tb.innerHTML = arr.map((d,i)=>{
    const lvl = levelOf(d);
    const rankCls = i===0 ? "g1" : i===1 ? "g2" : i===2 ? "g3" : "";
    const rankHtml = rankCls ? `<div class="rank ${rankCls}">${i+1}</div>` : `<span class="rank">${i+1}</span>`;
    const topCls = i<3 ? " class=\"top\"" : "";
    return `<tr${topCls}>
      <td>${rankHtml}</td>
      <td><div class="name-cell"><span class="avatar-sm">${d.name[0]}</span><div class="nm">${d.name}<div class="id">${d.id}</div></div></div></td>
      <td><span class="queue-pill">${d.queue}</span></td>
      <td class="num">${d.rate}</td>
      <td class="num">${d.answer.toLocaleString()}</td>
      <td class="num">${d.callback}</td>
      <td class="num">${d.avglen}</td>
      <td><span class="lvl ${lvl}"><i class="dot"></i>${LVL_TXT[lvl]}</span></td>
      <td><div class="score"><div class="bar"><span style="width:${Math.min(100,d.score)}%"></span></div><b>${d.score}</b></div></td>
    </tr>`;
  }).join("");
}

function renderAll(){
  const arr = filtered();
  renderHero(arr);
  renderTable(arr);
  updateQueueButtons();
  const hero = document.getElementById("hero"); hero.classList.remove("anim"); void hero.offsetWidth; hero.classList.add("anim");
  const tb = document.getElementById("tbody"); tb.classList.remove("anim"); void tb.offsetWidth; tb.classList.add("anim");
  restartAutoScroll();
}

function updateQueueButtons(){
  [...document.getElementById("qfilter").children].forEach((btn, idx)=>{
    btn.classList.toggle("active", idx === state.queueIndex);
  });
}

/* 队列轮播：综合 → 人社 → 公教企 → 综合 ... */
function startCycle(){
  cyclePaused = false; cycleStart = Date.now();
  if (cycleTimer) clearInterval(cycleTimer);
  cycleTimer = setInterval(() => {
    if (cyclePaused) return;
    state.queueIndex = (state.queueIndex + 1) % QUEUES.length;
    renderAll();
  }, CYCLE_SEC * 1000);
}
function pauseCycle(){ cyclePaused = true; }
function resumeCycle(){ if(cyclePaused){ cyclePaused = false; cycleStart = Date.now(); } }
function updateTimer(){
  const cd = document.getElementById("countdown");
  const txt = document.getElementById("cdTxt");
  function tick(){
    if (cyclePaused){ cd.classList.add("paused"); txt.textContent = "已暂停（搜索中）"; requestAnimationFrame(tick); return; }
    cd.classList.remove("paused");
    const elapsed = (Date.now() - cycleStart) % (CYCLE_SEC * 1000);
    const remain = Math.max(0, Math.ceil((CYCLE_SEC * 1000 - elapsed) / 1000));
    txt.textContent = "自动轮播 · " + remain + "s 后切换";
    requestAnimationFrame(tick);
  }
  tick();
}

/* 长表格自动缓慢滚动循环 */
let scrollToken = 0;
function restartAutoScroll(){
  const sc = document.getElementById("scroll");
  sc.scrollTop = 0;
  const token = ++scrollToken;
  function loop(){
    if (token !== scrollToken) return;
    if (!cyclePaused && !searchActive && !hoverPause && sc.scrollHeight > sc.clientHeight + 4){
      sc.scrollTop += 0.7;
      if (sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 1) sc.scrollTop = 0;
    }
    requestAnimationFrame(loop);
  }
  loop();
}

/* 实时北京时间 */
function tickClock(){
  const el = document.getElementById("clockTime");
  const dt = document.getElementById("clockDate");
  function fmt(){
    const now = new Date();
    const p = n => String(n).padStart(2,"0");
    const t = p(now.getHours())+":"+p(now.getMinutes())+":"+p(now.getSeconds());
    const wk = ["日","一","二","三","四","五","六"][now.getDay()];
    el.textContent = t;
    dt.textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · 星期${wk}`;
  }
  fmt(); setInterval(fmt, 1000);
}

/* ===== Theme switching ===== */
function applyTheme(idx){
  const t = THEMES[idx];
  document.body.className = "theme-" + t.id;
  document.getElementById("curName").textContent = "当前：" + t.name;
  [...document.getElementById("swatchGrid").children].forEach((s,i)=>s.classList.toggle("active", i===idx));
}
function buildPicker(){
  const grid = document.getElementById("swatchGrid");
  grid.innerHTML = THEMES.map((t,i)=>`
    <div class="swatch" data-i="${i}">
      <div class="chip" style="background:${t.g}"></div>
      <div><div class="nm">${t.name}</div><div class="idx">#${String(i+1).padStart(2,"0")}</div></div>
    </div>`).join("");
  grid.querySelectorAll(".swatch").forEach(s=>{
    s.onclick = ()=> applyTheme(+s.dataset.i);
  });
}
document.addEventListener("keydown", e=>{
  if (e.key === "h" || e.key === "H"){
    const p = document.getElementById("picker");
    p.style.display = p.style.display === "none" ? "block" : "none";
  }
});

/* 交互绑定 */
const qf = document.getElementById("qfilter");
QUEUES.forEach((q, idx)=>{
  const b = document.createElement("button");
  b.className = "seg" + (idx===state.queueIndex?" active":"");
  b.innerHTML = `<i class="live"></i>${q}`;
  b.onclick = ()=>{ state.queueIndex = idx; cycleStart = Date.now(); renderAll(); };
  qf.appendChild(b);
});

document.getElementById("searchInput").oninput = e => {
  state.search = e.target.value; searchActive = !!state.search;
  if (state.search){ pauseCycle(); } else { resumeCycle(); cycleStart = Date.now(); }
  renderAll();
};

document.querySelectorAll("thead th[data-field]").forEach(th=>{
  th.onclick = ()=>{
    const f = th.dataset.field;
    if (state.field === f) state.dir = state.dir==="asc"?"desc":"asc";
    else { state.field = f; state.dir = "desc"; }
    syncHeaderArrows(); renderAll();
  };
});
function syncHeaderArrows(){
  document.querySelectorAll("thead th[data-field]").forEach(th=>{
    const f = th.dataset.field;
    th.classList.toggle("sorted", f===state.field);
    const a = th.querySelector(".arrow");
    if (a) a.textContent = f===state.field ? (state.dir==="asc"?"↑":"↓") : "↕";
  });
}

const sc = document.getElementById("scroll");
sc.addEventListener("mouseenter", ()=> hoverPause = true);
sc.addEventListener("mouseleave", ()=> hoverPause = false);

buildPicker();
applyTheme(0);
syncHeaderArrows();
renderAll();
startCycle();
updateTimer();
tickClock();
</script>
